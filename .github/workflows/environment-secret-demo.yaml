name: Environment Secret Demo
on: 
  workflow_dispatch:
permissions:
    contents: read
jobs:
  verify-staging-secret:
    name: Verify Staging Secret
    runs-on: ubuntu-latest
    environment: staging
    steps:
      
      - name: Diagnose secret availability
        env:
          DEMO_TOKEN: ${{ secrets.DEMO_STAGING_TOKEN }}
        shell: bash
        run: |
          if [ -z "${DEMO_TOKEN+x}" ]; then
            echo "Diagnostic: environment variable is not set."
            exit 1
          elif [ -z "$DEMO_TOKEN" ]; then
            echo "Diagnostic: environment variable exists but is empty."
            exit 1
          else
            echo "Diagnostic: environment variable is present and non-empty."
          fi
