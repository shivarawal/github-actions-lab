name: Environment Secret Demo
on: 
  workflow_dispatch:
permissions:
    contents: read
jobs:
  verify-staging-secret:
    name: Verify Staging Secret
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Check Secret availability
        env: 
          DEMO_SECRET: ${{ secrets.DEMO_STAGING_TOKEN }}
        shell: bash
        run: |
          if [ -n "$DEMO_TOKEN" ]; then
            echo "staging secret is available."
          else
            echo "staging secret is missing."
            exit 1 
          fi