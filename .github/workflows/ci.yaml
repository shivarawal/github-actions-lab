
name: First CI Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: read
jobs:
  basic-check:
    name: Run Basic Check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show runner hostname
        run: hostname

      - name: Show current directory
        run: pwd

      - name: Show uptime
        run: uptime

      - name: Show disk usage
        run: df -h

      - name: Show memory usage
        run: free -h

      - name: Print success message
        run: echo "Basic check job completed successfully"

      - name: Practice expressions
        run: |
          echo "Triggered by: ${{ github.actor}}"
          echo "Git reference: ${{ github.ref}}"
          echo "Runner OS: ${{ runner.os}}"

      - name: Check main branch
        if: ${{ github.ref == 'refs/heads/main'}}
        run: echo "This workflow is running on main"

      - name: Check feature branch
        if: ${{ github.ref == 'refs/heads/feature-test' }}
        run: echo "This workflow is running on feature-test"

      - name: Check branch using contains
        if: ${{ contains(github.ref, 'main') }}
        run: echo "the branch refrence contains main"

      - name: Check branch using startsWith
        if: ${{ startsWith(github.ref, 'refs/heads/main') }}
        run: echo "the branch refrence starts with main"
      
      - name: check main branch and linux runner
        if: ${{ github.ref == 'refs/heads/main' && runner.os == 'Linux' }}
        run: echo "This workflow is running on main and on Linux"

      - name: check main branch or linux runner
        if: ${{ github.ref == 'refs/heads/main' || runner.os == 'Linux' }}
        run: echo "This workflow is running on main or on Linux"

      - name: Practice format function 
        run: echo "${{ format('Hello {0}, welcome to {1}!', github.actor, github.ref) }}"

      - name: Explore github context 
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Workflow: ${{ github.workflow }}"
          echo "Event name: ${{ github.event_name }}"
          echo "Actor: ${{ github.actor }}"
          echo "Run ID: ${{ github.run_id }}"
          echo "Run number: ${{ github.run_number }}"
          echo "Job ID: ${{ github.job }}"
          echo "Ref: ${{ github.ref }}"
          echo "SHA: ${{ github.sha }}"

      - name: Explore env context
        env: 
          APP_NAME: github-actions-lab
          DEPLOY_ENV: staging
        run: |
          echo "App name: $APP_NAME"
          echo "Deploy environment: $DEPLOY_ENV"
          echo "App name via expression: ${{ env.APP_NAME }}"
          echo "Deploy environment via expression: ${{ env.DEPLOY_ENV }}"
      - name:  Check Demo Secret
        env: 
          DEMO_TOKEN: ${{ secrets.DEMO_TOKEN }}
        run: |
          if [ -n "$DEMO_TOKEN"]; then
            echo "Demo secret is configured"
          else 
            echo "Demo secret is missing"
            exit 1
          fi

      - name:  Test GITHUB_TOKEN authentication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN}}
        run: gh api "repos/$GITHUB_REPOSITORY" --jq '.full_name'
  build:
    name: Build the application 
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      build_version: ${{ steps.version.outputs.version }}
    steps:
      - name: Generate build version
        id: version
        env:
          BUILD_VERSION: 1.2.0
        run: echo "version=${BUILD_VERSION}" >> $GITHUB_OUTPUT
      - name: Display build version
        run: echo "Build version is ${{ steps.version.outputs.version }}"
      - name: Set build mode
        run: echo "BUILD_MODE=production" >> "$GITHUB_ENV"
      - name: Display build mode
        run: echo "Build mode is $BUILD_MODE"
      - name: Practice continue-on-error
        continue-on-error: true
        run: exit 1 
      - name: create a custom command 
        run: |
          mkdir -p "$HOME/custom-bin"
          printf '#!/bin/bash\necho "Custom command executed successfully"\n' > "$HOME/custom-bin/hello-ci"
          chmod +x "$HOME/custom-bin/hello-ci"
          echo "$HOME/custom-bin" >> "$GITHUB_PATH"
      - name: Run custom command
        run: hello-ci
  test:
    name: Test application
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Display build version from build job
        run: echo "Build version from build job is ${{ needs.build.outputs.build_version }}"
      - name: Simulate tests
        run: echo "tests completed successfully"
      - name: show failure diagnostic
        if: failure()
        run: echo "Test step failed; collecting diagnostics"
      - name: Always print final report
        if: always()
        run: echo "Test job completed with status"
      - name: Explore needs context
        run: |
          echo "BUild job result: ${{ needs.build.result }}"
          echo "BUild version: ${{ needs.build.outputs.build_version }}"

      - name: Explore vars context
        run: | 
          echo "App environment: ${{ vars.APP_ENV }}"
  deploy:
    name: Deploy application
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Simulate deployment
        run: echo "Application deployed successfully"

  matrix-demo:
    name: Test on ${{ matrix.os}}
    runs-on: ${{ matrix.os}}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Show operating system
        run: echo "running on ${{ matrix.os}}"

  release-demo:
    name: Release Permission Demo
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Show release permission setup
        run: echo "This job is configured for repository content write access"