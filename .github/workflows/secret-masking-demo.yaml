name: Secret Masking Demo
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  secret-masking:
    name: Test secret masking
    runs-on: ubuntu-latest
    steps:
      - name: Create dummy secret
        env:
          DEMO_SECRET: "dummy-secret-12345"
        run: |
          echo "::add-mask::$DEMO_SECRET"
          echo "The dummy secret is: $DEMO_SECRET"
          echo "The secret should appear masked in the logs."