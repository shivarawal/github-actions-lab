name: Environment variables Demo
on: 
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - run: echo "Deploying to DEV"

  deploy-staging:
    runs-on: deploy-dev
    environment: staging
    steps:
      - run: echo "Deploying to STAGING"
  
  deploy-production:
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment: production
    steps:
      - run: echo "Deploying to PRODUCTION"
