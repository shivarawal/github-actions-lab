name: Secure Secret Handling Demo
on: 
  workflow_dispatch:
permissions:
    contents: read
jobs:
    secure-authentication:
      name: Test Secure Authentication
      runs-on: ubuntu-latest

      steps: 
        - name: Authentication using Github Secret
          env: 
            GH_TOKEN: ${{ secrets.MY_GITHUB_TOKEN_NEW }}
          run: |
            gh api user --jq '"Authenticated as: " + .login'