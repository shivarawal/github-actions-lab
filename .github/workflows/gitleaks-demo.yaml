name: GItleaks Secret Scan
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write 
jobs:
  secret-scan:
    name: Scan Repository For Secrets
    runs-on: ubuntu-latest

    steps: 
      - name: Checkout repository
        uses: actions/checkout@6 
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN}}